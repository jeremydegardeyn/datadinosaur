server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;
    absolute_redirect off;   # keep :8080 on redirects in dev

    # Block sensitive files
    location ~ /\.(env|git|yaml|json|sql|md|sh|ini|lock)$ { deny all; return 404; }
    location ~ ^/(src|vendor|scripts)/ { deny all; return 404; }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|webp)$ {
        try_files $uri =404;
    }

    # Static Brain Break apps (mirrors app.conf)
    location ~ ^/(kana|ear|gauntlet)$ { return 301 $uri/; }
    location ~ ^/(kana|ear|gauntlet)/ {
        index index.html;
        try_files $uri $uri/ /$1/index.html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
    }
}
