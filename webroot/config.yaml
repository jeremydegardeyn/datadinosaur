site:
  name: "DataDinosaur"
  tagline: "Human Data Expertise for the AI Era"
  description: "Real-world data engineering insights, career advice, and consulting for professionals navigating the AI landscape."
  base_url: "https://www.datadinosaur.com"
  author: "Jeremy DeGardeyn"
  author_title: "Data & AI Architect"
  copyright_year: 2026

nav:
  - label: "Start here"
    href: "/start-here"
  - label: "Blog"
    href: "/blog"
  - label: "Services"
    href: "/services"
  - label: "Brain Breaks"
    href: "/brain-breaks"
  - label: "About"
    href: "/about"
  - label: "Contact"
    href: "/contact"

# One-line descriptions shown on series pages and on /start-here.
# The key must match the post's `series` value exactly.
series:
  "AI gateway": "How to govern model and agent traffic through a gateway: operating models, routing, a cross-cloud containment lab, and where policy should bind."
  "FinChat build log": "Building FinChat, a reference retail-banking data and AI platform on Google Cloud: grounding, evals, policy as code, safety alerting, and ServiceNow integration."
  "RAG in practice": "Retrieval-augmented generation from the data side: why answers go wrong, how to secure the pipeline, and a working RAG chat widget."

start_here:
  top_posts:
    - "alternative-to-buying-capacity-to-fix-dataflow-stockouts"
    - "thinking-of-an-agent-as-a-colleague"
    - "multi-turn-context-safety-alerting-catching-what-a-per-message-filter-cannot"
    - "managing-data-products-in-google-clouds-knowledge-catalog"
    - "stop-your-gcp-bill-before-it-stops-you"

blog:
  posts_per_page: 8
  show_author:    true
  show_date:      true
  show_read_time: true
  show_views:     false
  show_tags:      true
  show_category:  true
  comments_enabled:    true
  comment_moderation:  true        # pending until admin approves
  excerpt_length:      200         # chars for auto-excerpt
  date_format:         "F j, Y"
  show_sidebar:        true
  sidebar_widgets:
    - search
    - series
    - categories
    - recent_posts

ads:
  enabled: false                   # flip to true when ready
  # Paste your Google AdSense code below after enabling
  header_ad_code:        ""
  sidebar_ad_code:       ""
  between_posts_ad_code: ""

contact:
  email: "jeremy@datadinosaur.com"
  consulting_types:
    - "AI Gateway Readiness Review"
    - "RAG Security Assessment"
    - "Data Architecture Review"
    - "Data Governance & Metadata Strategy"
    - "AI / Gen AI Integration"
    - "Data Quality Assessment"
    - "General Question"

# Analytics — sign up free at goatcounter.com (no cookies, GDPR-clean)
# Set enabled: true and paste your GoatCounter site code (the subdomain part)
# e.g. if your URL is https://datadinosaur.goatcounter.com, code is "datadinosaur"
analytics:
  enabled: true
  goatcounter_code: "datadinosaur"
  search_console_url: "https://search.google.com/search-console?resource_id=sc-domain%3Adatadinosaur.com&hl=en"

